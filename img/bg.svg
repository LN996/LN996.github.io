<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- 傍晚天空:天青 -> 淡橙 -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a6fd4"/>
      <stop offset="0.35" stop-color="#7d9fe8"/>
      <stop offset="0.62" stop-color="#b8d4f2"/>
      <stop offset="0.82" stop-color="#ffd9b8"/>
      <stop offset="1" stop-color="#ffc4a3"/>
    </linearGradient>
    <!-- 太阳光晕 -->
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7e0" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ffe3ae" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe3ae" stop-opacity="0"/>
    </radialGradient>
    <!-- 云朵:白色柔和 -->
    <radialGradient id="cloud" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- 远山剪影 -->
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f7fc0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5f7fc0" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d5a96" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#2c4470" stop-opacity="0.85"/>
    </linearGradient>
    <!-- 前景草地剪影(少女站台的感觉) -->
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22355c"/>
      <stop offset="1" stop-color="#16233f"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- 太阳 -->
  <circle cx="1460" cy="660" r="330" fill="url(#sun)"/>
  <circle cx="1460" cy="660" r="72" fill="#fff3d6" opacity="0.9"/>

  <!-- 远处星点(上半天空) -->
  <g fill="#ffffff">
    <circle cx="180" cy="90" r="2" opacity="0.8"/>
    <circle cx="420" cy="60" r="1.6" opacity="0.6"/>
    <circle cx="660" cy="120" r="2.2" opacity="0.75"/>
    <circle cx="900" cy="70" r="1.5" opacity="0.55"/>
    <circle cx="1120" cy="140" r="1.8" opacity="0.65"/>
    <circle cx="1700" cy="100" r="2" opacity="0.7"/>
    <circle cx="300" cy="200" r="1.4" opacity="0.5"/>
    <circle cx="1240" cy="50" r="1.6" opacity="0.6"/>
    <circle cx="1560" cy="160" r="1.4" opacity="0.5"/>
  </g>

  <!-- 卷云(细长) -->
  <g fill="url(#cloud)">
    <ellipse cx="360" cy="300" rx="340" ry="40"/>
    <ellipse cx="1500" cy="240" rx="380" ry="36"/>
    <ellipse cx="900" cy="380" rx="420" ry="44" opacity="0.75"/>
    <ellipse cx="200" cy="480" rx="280" ry="34" opacity="0.8"/>
    <ellipse cx="1680" cy="430" rx="300" ry="34" opacity="0.7"/>
  </g>

  <!-- 朵状云 -->
  <g fill="url(#cloud)">
    <ellipse cx="540" cy="420" rx="150" ry="60"/>
    <ellipse cx="640" cy="390" rx="110" ry="52"/>
    <ellipse cx="460" cy="400" rx="95" ry="46"/>
    <ellipse cx="1240" cy="330" rx="170" ry="64"/>
    <ellipse cx="1350" cy="305" rx="120" ry="54"/>
    <ellipse cx="1140" cy="315" rx="100" ry="48"/>
    <ellipse cx="820" cy="560" rx="140" ry="52" opacity="0.8"/>
    <ellipse cx="240" cy="620" rx="150" ry="50" opacity="0.7"/>
  </g>

  <!-- 飞鸟剪影 -->
  <g stroke="#3a4f7d" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.65">
    <path d="M700 250 q14 -12 28 0 M728 250 q14 -12 28 0"/>
    <path d="M790 300 q10 -9 20 0 M810 300 q10 -9 20 0"/>
    <path d="M640 330 q8 -7 16 0 M656 330 q8 -7 16 0"/>
  </g>

  <!-- 远山 -->
  <path d="M0 780 Q 300 660 620 760 T 1280 730 T 1920 770 L 1920 1080 L 0 1080 Z" fill="url(#hillFar)"/>
  <!-- 近山 -->
  <path d="M0 860 Q 380 740 760 850 T 1440 840 T 1920 870 L 1920 1080 L 0 1080 Z" fill="url(#hillNear)"/>

  <!-- 前景高地剪影 + 栏杆(站台感) -->
  <path d="M0 960 Q 500 900 960 950 T 1920 940 L 1920 1080 L 0 1080 Z" fill="url(#ground)"/>
  <g stroke="#141f38" stroke-width="7" stroke-linecap="round" opacity="0.9">
    <line x1="120" y1="1000" x2="120" y2="942"/>
    <line x1="300" y1="996" x2="300" y2="938"/>
    <line x1="480" y1="992" x2="480" y2="934"/>
    <line x1="60" y1="948" x2="500" y2="940"/>
    <line x1="60" y1="972" x2="500" y2="964"/>
  </g>

  <!-- 侧逆光少女剪影(眺望远方) -->
  <g fill="#101a30" opacity="0.92">
    <!-- 头发(被风吹起) -->
    <path d="M1628 640 q-52 -44 -44 -110 q6 -52 44 -66 q-14 40 -6 74 q6 26 24 40 Z"/>
    <path d="M1676 636 q58 -48 48 -116 q-8 -56 -50 -70 q16 44 6 78 q-8 28 -26 44 Z"/>
    <!-- 头 -->
    <circle cx="1654" cy="528" r="34"/>
    <!-- 裙摆/身体,迎风 -->
    <path d="M1622 552 q30 -14 64 0 q26 12 34 44 q18 76 -6 150 q-14 40 -60 40 q-46 0 -60 -40 q-24 -74 -6 -150 q8 -32 34 -44 Z"/>
    <!-- 手臂(背在身后/扶栏) -->
    <path d="M1620 590 q-26 20 -30 48 l10 6 q10 -24 28 -38 Z"/>
    <path d="M1688 590 q26 20 30 48 l-10 6 q-10 -24 -28 -38 Z"/>
  </g>
  <!-- 少女发丝高光(逆光边) -->
  <path d="M1654 462 q-30 6 -38 40 q-4 20 2 36" stroke="#ffd9a8" stroke-width="4" fill="none" opacity="0.55" stroke-linecap="round"/>

  <!-- 光斑(镜头光晕,动漫感) -->
  <g fill="#fff6df">
    <circle cx="500" cy="200" r="5" opacity="0.5"/>
    <circle cx="880" cy="150" r="3.5" opacity="0.4"/>
    <circle cx="1180" cy="260" r="4.5" opacity="0.45"/>
    <circle cx="1720" cy="330" r="3" opacity="0.4"/>
    <circle cx="320" cy="360" r="3.5" opacity="0.4"/>
  </g>
</svg>
