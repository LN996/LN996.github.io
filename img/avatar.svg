<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="av" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ea0ff"/>
      <stop offset="1" stop-color="#e57bd8"/>
    </linearGradient>
    <clipPath id="round">
      <circle cx="120" cy="120" r="120"/>
    </clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="240" height="240" fill="url(#av)"/>
    <circle cx="60" cy="50" r="60" fill="#ffffff" opacity="0.15"/>
    <circle cx="200" cy="200" r="70" fill="#ffffff" opacity="0.12"/>
    <text x="120" y="160" text-anchor="middle" font-size="104" font-weight="700"
          font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif"
          fill="#ffffff">李</text>
  </g>
</svg>
