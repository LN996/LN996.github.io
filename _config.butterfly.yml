# Butterfly 主题美化配置
# 放在博客根目录会自动覆盖/合并主题默认配置
# 完整可配置项见:node_modules/hexo-theme-butterfly/_config.yml

# 全站固定背景(渐变星点)。注意:主题会自动包 url(),这里只写路径
background: /img/bg.svg

# 首页顶部横幅
index_img: /img/banner.svg

# 其他页面(归档/分类/标签页)顶部横幅
default_top_img: /img/banner.svg

# 注入自定义玻璃拟态样式
inject:
  head:
    - <link rel="stylesheet" href="/css/custom.css">

# 关闭深色模式,保持浅色渐变观感一致
darkmode:
  enable: false

# 侧栏头像
avatar:
  img: /img/avatar.svg
  url: /

# 顶部导航:「笔记」按知识点分栏目
menu:
  首页: / || fas fa-home
  笔记:
    Python基础: /categories/Python基础/ || fas fa-code
    面向对象: /categories/面向对象/ || fas fa-cubes
    网络编程: /categories/网络编程/ || fas fa-network-wired
    并发编程: /categories/并发编程/ || fas fa-layer-group
    数据库: /categories/数据库/ || fas fa-database
    前端: /categories/前端/ || fas fa-html5
    Django: /categories/Django/ || fas fa-rocket
    项目实战: /categories/项目实战/ || fas fa-hammer
    运维与面试: /categories/运维与面试/ || fas fa-server
    练习与代码: /categories/练习与代码/ || fas fa-keyboard
  归档: /archives/ || fas fa-archive
  关于: /about/ || fas fa-user
